name: Build and publish releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows package
        shell: pwsh
        run: .\packaging\build-windows.ps1 $env:GITHUB_REF_NAME.TrimStart("v")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/packages/*.zip

linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          # FIX 1: Added libfuse2 to the install list
          sudo apt-get install -y apt-utils dpkg-dev rpm createrepo-c python3-tk libfuse2
          curl -L https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Linux packages
        # FIX 2: Added the ARCH environment variable
        env:
          ARCH: x86_64
        run: |
          chmod +x packaging/linux/*.sh
          packaging/linux/build-packages.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/packages/*

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arch build tools
        run: |
          pacman -Sy --noconfirm --needed python python-pip tk base-devel git
      - name: Build Arch package
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --clean --noconfirm file_utility_suite.spec
          chmod +x packaging/linux/build-arch-package.sh
          packaging/linux/build-arch-package.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/packages/*.pkg.tar.*

  publish:
    needs: [windows, linux, arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/packages
          merge-multiple: true
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev createrepo-c gnupg
      - name: Import repository signing key
        env:
          REPOSITORY_GPG_PRIVATE_KEY: ${{ secrets.REPOSITORY_GPG_PRIVATE_KEY }}
        run: |
          test -n "$REPOSITORY_GPG_PRIVATE_KEY"
          printf '%s' "$REPOSITORY_GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '$1 == \"sec\" {print $5; exit}')"
          test -n "$GPG_KEY_ID"
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
      - name: Generate signed repositories
        run: |
          chmod +x packaging/linux/publish-repositories.sh
          packaging/linux/publish-repositories.sh dist/packages dist/repository
      - name: Publish repository branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist/repository
          destination_dir: repo
          keep_files: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/packages/*
