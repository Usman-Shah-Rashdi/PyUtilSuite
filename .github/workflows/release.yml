name: Build and publish releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows package
        shell: pwsh
        run: .\packaging\build-windows.ps1 $env:GITHUB_REF_NAME.TrimStart("v")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/packages/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev rpm createrepo-c python3-tk libfuse2
          curl -L https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Linux packages
        env:
          ARCH: x86_64
        run: |
          chmod +x packaging/linux/*.sh
          packaging/linux/build-packages.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/packages/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/packages
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/packages/*
          generate_release_notes: true
